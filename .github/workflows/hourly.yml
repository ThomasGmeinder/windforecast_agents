name: hourly rolling wind forecast

# GitHub cron is best-effort and may start late. hourly_run.py records the real issue
# time and moves the valid window to the next complete hour, so a delayed runner never
# claims to have forecast an hour that had already begun.
on:
  repository_dispatch:
    types: [hourly_forecast]
  schedule:
    # Temporary scheduler validation: should create a run at 15:30 Berlin today
    # (13:30 UTC). Keep the actual issue time in the record; cron itself is UTC.
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Serialize with the daily learner: both write logs/models and publish Pages.
  group: wind-forecast-pipeline
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv
      - run: uv pip install --python .venv numpy

      - name: Issue next 24-hour rolling windows
        id: issue
        # Must finish before the valid hour. A timeout is a failed issuance, not a
        # reason to block Pages or overlap the next scheduled :55 run.
        run: timeout --signal=TERM 240s .venv/bin/python hourly_run.py
        # A transient upstream API/TLS failure must not prevent deployment of the
        # already-committed renderer and last valid hourly records. The failed issuance
        # remains red in this step; the next hourly run retries it.
        continue-on-error: true

      - name: Record issuance failure
        if: steps.issue.outcome == 'failure'
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          mkdir -p logs
          python - <<'PY'
          import datetime, json
          now = datetime.datetime.now(datetime.timezone.utc)
          row = {'ok': False, 'time': now.isoformat(), 'trigger': __import__('os').environ['TRIGGER_EVENT'], 'hour': (now + datetime.timedelta(hours=1)).hour,
                 'message': 'Hourly forecast issuance failed; displaying last valid records.'}
          with open('logs/hourly_status.json', 'w') as f: json.dump(row, f)
          with open('logs/hourly_status.jsonl', 'a') as f: f.write(json.dumps(row) + '\n')
          PY

      - name: Record successful issuance
        if: steps.issue.outcome == 'success'
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          mkdir -p logs
          python - <<'PY'
          import datetime, json, glob
          now = datetime.datetime.now(datetime.timezone.utc)
          starts = []
          for path in glob.glob('logs/*_hourly_forecast.jsonl'):
              rows = [json.loads(x) for x in open(path) if x.strip()]
              if rows: starts.append(rows[-1].get('valid_start'))
          row = {'ok': True, 'time': now.isoformat(), 'trigger': __import__('os').environ['TRIGGER_EVENT'],
                 'valid_start': min(starts) if starts else None,
                 'hour': int(min(starts)[11:13]) if starts else (now + datetime.timedelta(hours=1)).hour,
                 'message': 'Hourly forecast issued successfully.'}
          with open('logs/hourly_status.json', 'w') as f: json.dump(row, f)
          with open('logs/hourly_status.jsonl', 'a') as f: f.write(json.dumps(row) + '\n')
          PY

      - name: Build static report
        run: .venv/bin/python build_site.py

      - name: Commit hourly forecast records
        run: |
          git config user.name "wind-bot"
          git config user.email "wind-bot@users.noreply.github.com"
          # site/ is intentionally ignored; deploy it as the Pages artifact below.
          git add logs models
          git commit -m "hourly: rolling forecast $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Surface issuance failure after deployment
        if: steps.issue.outcome == 'failure'
        run: |
          echo "Hourly forecast issuance failed; Pages deployed the last valid records."
          exit 1
