name: daily wind forecast + self-learning

# Runs the whole loop once a day, commits the learned state back to the repo
# (git = the persistent store on ephemeral runners), and publishes the report to
# GitHub Pages. Manual runs via the "Run workflow" button too.
on:
  schedule:
    # GitHub cron is UTC. 03:07 UTC ≈ 05:07 Berlin in summer (CEST) / 04:07 in winter (CET).
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write              # commit the learned state back to main
  pages: write                 # publish the report
  id-token: write              # required by deploy-pages

concurrency:
  group: wind-forecast-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4          # brings in yesterday's committed state

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v3
      - run: uv venv
      # numpy only. The GRIB reader (cfgrib/eccodes/xarray) is reachable solely from
      # winddata's own __main__ self-test, never from daily_run, and pandas is unused —
      # installing heavy binary wheels every morning cost minutes and added failure modes
      # for code the pipeline does not execute.
      - run: uv pip install --python .venv numpy

      # Fail fast if the referee or the safety gate is broken — these are pure, offline
      # and fast, and a silently-broken verifier would let bad tuning through unnoticed.
      # Hermetic; gates the live pipeline so a broken referee can never tune anything.
      - name: Self-tests + end-to-end loop simulation
        run: |
          .venv/bin/python lib/verify.py
          .venv/bin/python lib/tuner.py selftest
          .venv/bin/python lib/ledger.py
          .venv/bin/python lib/postproc.py
          .venv/bin/python lib/forecast.py selftest
          .venv/bin/python lib/simulate.py offline

      - name: Legacy daily audit (no model or Pages writes)
        env:
          # analyst is advisory + guarded: without this secret it cleanly skips.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GEMINI_MODEL: gemini-3-flash   # pin once confirmed via AI Studio
        run: |
          # Preserve the legacy audit code in the repository, but hourly_run.py owns
          # forecasts, RLS updates, current measurements, commits, and Pages deployment.
          .venv/bin/python lib/verify.py all
